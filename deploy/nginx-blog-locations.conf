root /opt/ai-myhome-blog/public;
client_max_body_size 50m;

# 不暴露 nginx 版本号
server_tokens off;

# 基础安全响应头（HTTPS 站点；含子域会影响 blog-test，故不加 includeSubDomains）
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# 压缩 JS/CSS/JSON 和反代返回的 HTML
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss image/svg+xml;

access_log /var/log/nginx/blog-access.log;
error_log /var/log/nginx/blog-error.log;

# 带 hash 的构建产物，长期缓存
location /_nuxt/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /vendor/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

location /fonts/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

location /avatar.webp {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# 博客配图（文章内引用，改动少）：30 天缓存
location /images/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# 聊天 SSE：关闭缓冲，拉长超时
location = /api/agent {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location / {
    try_files $uri @nuxt;
}

location @nuxt {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
